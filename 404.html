<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- Primary Meta Tags -->
    <title>Page Not Found | Meatlovers Restaurant - Nairobi</title>
    <meta name="description"
        content="Oops! The page you're looking for cannot be found. Return to Meatlovers Restaurant homepage to explore our delicious grilled meats and Kenyan cuisine.">
    <meta name="keywords" content="404 error, page not found, Meatlovers Nairobi, restaurant error page">

    <base href="/Meatlovers/">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://meatlovers.co.ke/404">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://meatlovers.co.ke/404">
    <meta property="og:title" content="404 - Page Not Found | Meatlovers Nairobi">
    <meta property="og:description"
        content="The page you're looking for doesn't exist. Let's get you back to deliciousness!">
    <meta property="og:image" content="assets/img/hero/burger.webp">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        /* Hero Section - Dramatic Error */
        .error-hero {
            min-height: 80vh;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.88) 0%, rgba(0, 0, 0, 0.75) 100%),
                url('assets/img/hero/interior3.jpeg');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            position: relative;
        }

        /* Animated smoke/grill effect */
        .error-hero::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 200px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.5), transparent);
            pointer-events: none;
        }

        .error-content {
            max-width: 700px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }

        /* Giant 404 Number with Flame Effect */
        .error-code {
            font-size: 10rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 0.5rem;
            font-family: var(--font-heading);
            background: linear-gradient(135deg, #e67e22 0%, #f39c12 50%, #e67e22 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(230, 126, 34, 0.3);
            animation: flicker 2s infinite;
        }

        @keyframes flicker {

            0%,
            100% {
                opacity: 1;
                text-shadow: 0 0 20px rgba(230, 126, 34, 0.3);
            }

            50% {
                opacity: 0.95;
                text-shadow: 0 0 35px rgba(230, 126, 34, 0.5);
            }
        }

        .error-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -0.5px;
        }

        .error-message {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .redirect-message {
            margin-top: 2rem;
            font-size: 1.5rem;
            opacity: 0.8;
        }

        #countdown {
            font-weight: 700;
            color: var(--primary);
            font-size: 1.1rem;
        }


        /* Responsive */
        @media (max-width: 768px) {
            .error-code {
                font-size: 6rem;
            }

            .error-title {
                font-size: 1.6rem;
            }

            .error-message {
                font-size: 1rem;
            }

        }

        @media (max-width: 480px) {
            .error-code {
                font-size: 4.5rem;
            }

            .error-title {
                font-size: 1.3rem;
            }

            .error-divider {
                gap: 0.8rem;
                font-size: 1.2rem;
            }

            .suggestion-card {
                padding: 1.5rem;
            }
        }

        /* Animation for floating elements */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }


        @media (max-width: 768px) {
            .floating-meat {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- 404 Hero Section -->
    <section class="error-hero">

        <div class="error-content">
            <div class="error-code">404</div>
            <h1 class="error-title">Oops! This page cannot be found.</h1>

            <p class="redirect-message">Redirecting to homepage in <span id="countdown">4</span> seconds...</p>

            <script>
                // Auto redirect with countdown
                let seconds = 4;
                const countdownElement = document.getElementById('countdown');

                const interval = setInterval(function () {
                    seconds--;
                    if (countdownElement) {
                        countdownElement.textContent = seconds;
                    }

                    if (seconds <= 0) {
                        clearInterval(interval);
                        window.location.href = '/Meatlovers/';
                    }
                }, 1000);
            </script>


        </div>
    </section>


    <script src="assets/js/main.js" defer></script>


    <!-- Schema markup for 404 page -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "404 - Page Not Found",
        "description": "The requested page could not be found on Meatlovers Restaurant website.",
        "url": "https://meatlovers.co.ke/404",
        "isPartOf": {
            "@type": "Restaurant",
            "name": "Meatlovers Restaurant",
            "address": {
                "@type": "PostalAddress",
                "streetAddress": "Agriculture House, Mezzanine Floor, Moi Avenue",
                "addressLocality": "Nairobi",
                "addressCountry": "KE"
            },
            "servesCuisine": "Kenyan, Grilled Meats, Barbecue",
            "priceRange": "KES 500 - 10,000"
        }
    }
    </script>

</body>

</html>
